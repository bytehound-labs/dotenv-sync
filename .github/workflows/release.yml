name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: Build and publish release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_released: ${{ steps.version.outputs.already_released }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for older release runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while true; do
            older_runs="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&event=push&per_page=100" \
                --jq '.workflow_runs[] | select(.id < '"${GITHUB_RUN_ID}"' and .status != "completed") | .id'
            )"
            if [ -z "${older_runs}" ]; then
              break
            fi
            echo "Waiting for older release runs to finish:"
            printf '%s\n' "${older_runs}"
            sleep 15
          done

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release metadata
        id: version
        run: |
          set -euo pipefail

          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"

          set +e
          go run ./scripts/nextversion --bump patch >"${stdout_file}" 2>"${stderr_file}"
          status=$?
          set -e

          cat "${stderr_file}" >&2
          VERSION="$(tr -d '\n' < "${stdout_file}")"

          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release workflow requires a stable semver tag like v1.2.3, got ${VERSION}"
            exit 1
          fi

          case "${status}" in
            0)
              echo "already_released=false" >> "${GITHUB_OUTPUT}"
              echo "Preparing new main release ${VERSION}"
              ;;
            2)
              echo "already_released=true" >> "${GITHUB_OUTPUT}"
              echo "Commit already released by tag ${VERSION}; refreshing release assets if needed."
              ;;
            *)
              exit "${status}"
              ;;
          esac

          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run test suite
        run: go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -rf dist .release
          mkdir -p dist .release
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"

          for target in ${targets}; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            workdir=".release/build_${GOOS}_${GOARCH}"
            rm -rf "${workdir}"
            mkdir -p "${workdir}"
            ext=""
            if [ "${GOOS}" = "windows" ]; then
              ext=".exe"
            fi

            binary="${workdir}/ds${ext}"
            cp LICENSE README.md "${workdir}/"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X dotenv-sync/pkg/dotenvsync.Version=${VERSION} -X dotenv-sync/pkg/dotenvsync.Commit=${COMMIT} -X dotenv-sync/pkg/dotenvsync.BuildTime=${BUILD_TIME}" \
              -o "${binary}" ./cmd/ds

            if [ "${GOOS}" = "windows" ]; then
              asset="dist/ds_${VERSION}_windows_${GOARCH}.zip"
              (cd "${workdir}" && zip -q -j "../../dist/$(basename "${asset}")" "ds${ext}" LICENSE README.md)
            else
              asset="dist/ds_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
              tar -C "${workdir}" -czf "${asset}" "ds${ext}" LICENSE README.md
            fi
          done

          checksum_file="dist/ds_${VERSION}_SHA256SUMS"
          (
            cd dist
            sha256sum ds_* > "$(basename "${checksum_file}")"
          )

          for asset in \
            "dist/ds_${VERSION}_linux_amd64.tar.gz" \
            "dist/ds_${VERSION}_linux_arm64.tar.gz" \
            "dist/ds_${VERSION}_darwin_amd64.tar.gz" \
            "dist/ds_${VERSION}_darwin_arm64.tar.gz" \
            "dist/ds_${VERSION}_windows_amd64.zip"; do
            test -s "${asset}"
          done

      - name: Verify the Linux reference artifact reports its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .release/verify
          mkdir -p .release/verify
          tar -C .release/verify -xzf "dist/ds_${VERSION}_linux_amd64.tar.gz"
          test "$(.release/verify/ds --version)" = "ds ${VERSION}"

      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: dist
          format: cyclonedx-json
          output-file: release-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create release asset checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- * > ../release-assets.sha256
          )

      - name: Attest release asset provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release-assets.sha256

      - name: Save the provenance bundle for the release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" release-provenance.bundle.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign every release asset
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            cosign sign-blob \
              --yes \
              --bundle "${asset}.sigstore.json" \
              "${asset}"
          done < <(find dist -maxdepth 1 -type f -print0 | sort -z)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ALREADY_RELEASED: ${{ steps.version.outputs.already_released }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_files=(
            dist/ds_"${VERSION}"_*.tar.gz
            dist/ds_"${VERSION}"_*.zip
            dist/ds_"${VERSION}"_SHA256SUMS
            release-sbom.cdx.json
            release-assets.sha256
            release-provenance.bundle.json
            dist/*.sigstore.json
          )
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Refreshing existing GitHub release ${VERSION}"
            gh release upload "${VERSION}" "${release_files[@]}" --clobber
            exit 0
          fi

          if [ "${ALREADY_RELEASED}" = "true" ]; then
            echo "GitHub release for already-tagged version ${VERSION} is missing; recreating it."
          else
            echo "Publishing new GitHub release ${VERSION}"
          fi

          gh release create "${VERSION}" "${release_files[@]}" --title "${VERSION}" --generate-notes --target "${GITHUB_SHA}"

  publish_aur:
    name: Publish AUR package
    needs: release
    uses: ./.github/workflows/aur-publish.yml
    with:
      release_tag: ${{ needs.release.outputs.version }}
      pkgrel: '1'
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
