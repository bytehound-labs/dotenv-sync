name: Publish AUR package

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable semver tag to publish to AUR, for example v0.0.7
        required: true
        type: string
      pkgrel:
        description: Arch package release number for packaging-only updates
        required: false
        default: '1'
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        description: SSH private key for the dotenv-sync-bin AUR repository
        required: false
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable semver tag to publish to AUR, for example v0.0.7
        required: true
        type: string
      pkgrel:
        description: Arch package release number for packaging-only updates
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Update dotenv-sync-bin on AUR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: aur-publish-${{ inputs.release_tag || github.event.release.tag_name }}-${{ inputs.pkgrel || '1' }}
      cancel-in-progress: false

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          VERSION: ${{ inputs.release_tag || github.event.release.tag_name }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
        run: |
          set -euo pipefail
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::AUR publish requires a stable semver tag like v1.2.3, got ${VERSION}"
            exit 1
          fi
          if ! [[ "${PKGREL}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::AUR publish requires pkgrel >= 1, got ${PKGREL}"
            exit 1
          fi
          {
            echo "publish=true"
            echo "version=${VERSION}"
            echo "pkgver=${VERSION#v}"
            echo "pkgrel=${PKGREL}"
            echo "amd64_asset=ds_${VERSION}_linux_amd64.tar.gz"
            echo "arm64_asset=ds_${VERSION}_linux_arm64.tar.gz"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Check AUR credentials
        if: steps.meta.outputs.publish == 'true'
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping AUR publish because AUR_SSH_PRIVATE_KEY is not configured."
            exit 0
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Download Linux release assets
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.version }}
          AMD64_ASSET: ${{ steps.meta.outputs.amd64_asset }}
          ARM64_ASSET: ${{ steps.meta.outputs.arm64_asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --pattern "${AMD64_ASSET}" \
            --pattern "${ARM64_ASSET}" \
            --dir dist

      - name: Compute package checksums
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        id: sums
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.version }}
          AMD64_ASSET: ${{ steps.meta.outputs.amd64_asset }}
          ARM64_ASSET: ${{ steps.meta.outputs.arm64_asset }}
        run: |
          set -euo pipefail
          license="$(git show "${RELEASE_TAG}:LICENSE" | sha256sum | awk '{print $1}')"
          readme="$(git show "${RELEASE_TAG}:README.md" | sha256sum | awk '{print $1}')"
          amd64="$(sha256sum "dist/${AMD64_ASSET}" | awk '{print $1}')"
          arm64="$(sha256sum "dist/${ARM64_ASSET}" | awk '{print $1}')"
          {
            echo "license=${license}"
            echo "readme=${readme}"
            echo "amd64=${amd64}"
            echo "arm64=${arm64}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AUR SSH access
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan aur.archlinux.org >> "${HOME}/.ssh/known_hosts"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone AUR repository
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git clone "ssh://aur@aur.archlinux.org/dotenv-sync-bin.git" aur-repo

      - name: Render AUR package files
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.version }}
          PKGREL: ${{ steps.meta.outputs.pkgrel }}
          LICENSE_SHA256: ${{ steps.sums.outputs.license }}
          README_SHA256: ${{ steps.sums.outputs.readme }}
          X86_64_SHA256: ${{ steps.sums.outputs.amd64 }}
          AARCH64_SHA256: ${{ steps.sums.outputs.arm64 }}
        run: |
          set -euo pipefail
          go run ./scripts/aurpkg \
            --version "${RELEASE_TAG}" \
            --pkgrel "${PKGREL}" \
            --license-sha256 "${LICENSE_SHA256}" \
            --readme-sha256 "${README_SHA256}" \
            --x86_64-sha256 "${X86_64_SHA256}" \
            --aarch64-sha256 "${AARCH64_SHA256}" \
            --output-dir aur-repo

      - name: Commit and push AUR update
        if: steps.meta.outputs.publish == 'true' && steps.aur.outputs.configured == 'true'
        env:
          PKGVER: ${{ steps.meta.outputs.pkgver }}
          PKGREL: ${{ steps.meta.outputs.pkgrel }}
        run: |
          set -euo pipefail
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet --exit-code; then
            echo "AUR package is already up to date."
            exit 0
          fi
          git commit -m "upgpkg: dotenv-sync-bin ${PKGVER}-${PKGREL}"
          git push origin HEAD
